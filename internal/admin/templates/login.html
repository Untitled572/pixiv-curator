{{define "login.html"}}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>登录 · Pixiv Curator</title>
  <style>{{.CSS}}</style>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">PC</div>
    <p class="eyebrow">私人图库管理</p>
    <h1>欢迎回来</h1>
    <p class="muted">输入本机配置的管理凭据，登录作品目录管理。</p>
    <form id="login-form" class="stack-form">
      <label for="admin-token">管理令牌</label>
      <input id="admin-token" name="token" type="password" autocomplete="off" required autofocus>
      <label class="remember-choice" for="remember-login"><input id="remember-login" name="remember" type="checkbox">记住登录（30 天）</label>
      <button class="button button-primary" type="submit">安全登录 <span aria-hidden="true">→</span></button>
      <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
    </form>
    <p class="fine-print">仅保存登录会话，不保存管理令牌。未勾选时会话最长 12 小时；服务重启或退出登录后需重新验证。</p>
  </main>
  <script>{{.JS}}</script>
</body>
</html>
{{end}}
