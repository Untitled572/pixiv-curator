name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version tag
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH[-prerelease]'; exit 1; }
  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read

  image:
    name: Publish multi-platform Docker image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compute image name and tags
        id: meta
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "go_version=$(awk '/^go / {print $2; exit}' go.mod)" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$image:$VERSION"
            if [[ "$VERSION" != *-* ]]; then
              echo "$image:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GO_VERSION=${{ steps.meta.outputs.go_version }}
            VERSION=${{ github.ref_name }}

      - name: Verify GHCR manifest and export deployment image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p image-deploy
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > image-deploy/manifest.json
          python3 -c 'import json; d=json.load(open("image-deploy/manifest.json")); p={(x.get("platform",{}).get("os"),x.get("platform",{}).get("architecture")) for x in d["manifests"]}; assert {("linux","amd64"),("linux","arm64")} <= p, p'
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" "$IMAGE:$VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:$VERSION")" = "$GITHUB_SHA"
          export IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$IMAGE:$VERSION")"
          docker save "$IMAGE:$VERSION" | gzip -1 > image-deploy/image-linux-amd64.tar.gz
          (cd image-deploy && sha256sum image-linux-amd64.tar.gz > SHA256SUMS)
          python3 -c 'import json,os; json.dump({k:os.environ[k] for k in ("IMAGE","DIGEST","VERSION","IMAGE_ID","GITHUB_SHA")},open("image-deploy/image.json","w"),indent=2)'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-deploy-linux-amd64
          path: image-deploy/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release after all builds succeed
    needs: [build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ github.ref_name }}
      IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Verify archives and prepare release notes
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(find dist -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 4
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$VERSION" --jq .body > release-notes.md
          {
            printf '\n## Downloads\n\nLinux and Windows: amd64 / arm64. Verify archives with SHA256SUMS.\n'
            printf '\n## Docker\n\nImage: \x60%s:%s\x60\n\nDigest: \x60%s@%s\x60\n' "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST"
          } >> release-notes.md
      - name: Create or resume draft, upload all assets, then publish
        run: |
          if gh release view "$VERSION" --json isDraft --jq .isDraft > draft-state; then
            test "$(cat draft-state)" = true || { echo 'Release already published; use a new version tag.'; exit 1; }
          else
            gh release create "$VERSION" --verify-tag --draft --title "$VERSION" --notes-file release-notes.md
          fi
          gh release upload "$VERSION" dist/* --clobber
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$VERSION" --notes-file release-notes.md --draft=false --prerelease --latest=false
          else
            gh release edit "$VERSION" --notes-file release-notes.md --draft=false --latest=true
          fi
